<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibrosync</title>
    <link rel="stylesheet" href="/public/views/cadastro/style.css">
</head>

<body>
    <main>
        <div class="container">
            <h1>Crie sua conta</h1>
            <p class="tagline">Preencha seus dados</p>
            <form id="form-cadastro">
                <div class="campo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12.2505 13.8307C8.33752 13.8307 4.90552 16.1327 4.90552 18.7557C4.90552 22.1307 10.4345 22.1307 12.2505 22.1307C14.0665 22.1307 19.5945 22.1307 19.5945 18.7337C19.5945 16.1217 16.1625 13.8307 12.2505 13.8307Z"
                            fill="#FB18AF" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12.2119 11.6423H12.2429C14.9379 11.6423 17.1299 9.45026 17.1299 6.75526C17.1299 4.06126 14.9379 1.86926 12.2429 1.86926C9.54798 1.86926 7.35598 4.06126 7.35598 6.75326C7.34698 9.43926 9.52398 11.6323 12.2119 11.6423Z"
                            fill="#FB18AF" />
                    </svg>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome:" required>
                </div>
                <div class="campo">
                    <svg width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M18 0H2C0.9 0 0.00999999 0.9 0.00999999 2L0 14C0 15.1 0.9 16 2 16H18C19.1 16 20 15.1 20 14V2C20 0.9 19.1 0 18 0ZM18 4L10 9L2 4V2L10 7L18 2V4Z"
                            fill="#FB18AF" />
                    </svg>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Email:" required>
                </div>
                <div class="campo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M7 7V8C5.34315 8 4 9.34315 4 11V19C4 20.6569 5.34315 22 7 22H17C18.6569 22 20 20.6569 20 19V11C20 9.34315 18.6569 8 17 8V7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7ZM12 4C10.3431 4 9 5.34315 9 7V8H15V7C15 5.34315 13.6569 4 12 4ZM14 14C14 14.7403 13.5978 15.3866 13 15.7324V17C13 17.5523 12.5523 18 12 18C11.4477 18 11 17.5523 11 17V15.7324C10.4022 15.3866 10 14.7403 10 14C10 12.8954 10.8954 12 12 12C13.1046 12 14 12.8954 14 14Z"
                            fill="#FB18AF" />
                    </svg>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha:" required>
                    <button type="button" id="toggle-senha" class="toggle-senha" aria-label="Mostrar senha"
                        aria-controls="senha" aria-pressed="false">
                        <svg class="icone-mostrar" width="18" height="13" viewBox="0 0 18 13" fill="none"
                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path
                                d="M8.9248 0C4.97336 0 1.57916 2.37401 0.0767587 5.77272C-0.0256291 6.00434 -0.025629 6.26839 0.0767588 6.50001C1.57916 9.89872 4.97336 12.2727 8.9248 12.2727C12.8762 12.2727 16.2704 9.89872 17.7729 6.50001C17.8752 6.26839 17.8752 6.00434 17.7729 5.77272C16.2704 2.37401 12.8762 0 8.9248 0ZM8.9248 10.2273C6.66662 10.2273 4.8339 8.39455 4.8339 6.13636C4.8339 3.87818 6.66662 2.04545 8.9248 2.04545C11.183 2.04545 13.0157 3.87818 13.0157 6.13636C13.0157 8.39455 11.183 10.2273 8.9248 10.2273ZM8.9248 3.68182C7.56662 3.68182 6.47026 4.77818 6.47026 6.13636C6.47026 7.49455 7.56662 8.59091 8.9248 8.59091C10.283 8.59091 11.3793 7.49455 11.3793 6.13636C11.3793 4.77818 10.283 3.68182 8.9248 3.68182Z"
                                fill="#FB18AF" />
                        </svg>
                        <svg class="icone-esconder" width="19" height="16" viewBox="0 0 19 16" fill="none"
                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path
                                d="M16.9682 0.869862L16.2322 0.133919C16.0242 -0.0740721 15.6402 -0.042063 15.4002 0.245882L12.84 2.78985C11.688 2.29391 10.4241 2.05391 9.09604 2.05391C5.14392 2.06984 1.72014 4.37381 0.0720207 7.68602C-0.0240069 7.89401 -0.0240069 8.14994 0.0720207 8.32593C0.839954 9.89395 1.99202 11.19 3.43203 12.1659L1.33603 14.2939C1.09603 14.5339 1.06402 14.9179 1.22407 15.1259L1.96002 15.8618C2.16801 16.0698 2.55199 16.0378 2.79199 15.7499L16.8399 1.70198C17.1439 1.46211 17.1759 1.07815 16.9679 0.870136L16.9682 0.869862ZM9.94403 5.70175C9.67202 5.63773 9.38407 5.55778 9.11205 5.55778C7.752 5.55778 6.66411 6.6458 6.66411 8.00571C6.66411 8.27772 6.72813 8.56566 6.80809 8.83768L5.73597 9.89372C5.41601 9.33376 5.24003 8.70966 5.24003 8.00574C5.24003 5.87776 6.95205 4.16574 9.08003 4.16574C9.78409 4.16574 10.4081 4.34172 10.968 4.66168L9.94403 5.70175Z"
                                fill="#FB18AF" />
                            <path
                                d="M18.1201 7.68596C17.5602 6.56591 16.8241 5.55798 15.9122 4.74194L12.9361 7.68596V8.00591C12.9361 10.1339 11.2241 11.8459 9.09612 11.8459H8.77617L6.88818 13.7339C7.59224 13.8779 8.32819 13.9739 9.04819 13.9739C13.0003 13.9739 16.4241 11.6699 18.0722 8.34177C18.2162 8.11771 18.2162 7.8938 18.1202 7.68578L18.1201 7.68596Z"
                                fill="#FB18AF" />
                        </svg>
                    </button>
                    </br>
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Li e concordo com o termo de uso </label>
                    </br>
                    <button type="submit" id="cadastrar-btn">Cadastrar</button>
                </div>
                <div class="side">
                    <img src="/public/assets/img/logo_texto.png" alt="Logo do Fibrosync" class="logo">
                    <h1>Bem-Vindo!💜</h1>
                    <p>Acesse sua conta agora mesmo.</p>
                    </br>
                    <input type="button" id="entrar-btn" value="Entrar" required>
                </div>
            </form>
        </div>
    </main>
    <script src="/public/views/cadastro/script.js"></script>
</body>
<footer>
</footer>
