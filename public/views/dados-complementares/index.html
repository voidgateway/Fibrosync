<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete seu cadastro de paciente no Fibrosync.">
    <title>Complete seu cadastro | Fibrosync</title>
    <link rel="stylesheet" href="/public/views/dados-complementares/style.css">
</head>

<body>
    <main class="pagina-cadastro">
        <section class="container" aria-labelledby="titulo-cadastro">
            <img src="/public/assets/img/logo_texto.png" alt="Fibrosync" class="logo">

            <header class="cabecalho">
                <h1 id="titulo-cadastro">Crie sua conta</h1>
                <p>Preencha os dados complementares</p>
            </header>

            <form id="form-dados-complementares" novalidate>

                                fill="#D8B0D8" />
                        </svg>
                        <select id="genero" name="genero" required aria-describedby="erro-genero">
                            <option value="" selected disabled>Gênero:</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="nao-binario">Não binário</option>
                            <option value="outro">Outro</option>
                            <option value="nao-informar">Prefiro não informar</option>
                        </select>
                    </div>
                    <p class="mensagem-erro" id="erro-genero" aria-live="polite"></p>
                </div>

                <div class="grupo-campo">
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <div class="campo campo-data">
                        <svg width="18" height="20" viewBox="0 0 18 20" fill="none"
                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path fill-rule="evenodd" clip-rule="evenodd"

                        </svg>
                        <input type="date" id="data-nascimento" name="dataNascimento" required
                            aria-describedby="erro-data-nascimento">
                        <span class="placeholder-data" aria-hidden="true">Data de Nascimento:</span>
                    </div>
                    <p class="mensagem-erro" id="erro-data-nascimento" aria-live="polite"></p>
                </div>

                <fieldset class="grupo-historico" aria-describedby="erro-historico">
                    <legend>Histórico da Condição:</legend>

                    <label class="opcao">
                        <input type="radio" name="historicoCondicao" value="menos-de-1-ano" required>
                        <span>Menos de 1 ano</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="historicoCondicao" value="1-a-3-anos">
                        <span>1 a 3 anos</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="historicoCondicao" value="3-a-5-anos">
                        <span>3 a 5 anos</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="historicoCondicao" value="mais-de-5-anos">
                        <span>Mais de 5 anos</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="historicoCondicao" value="sem-diagnostico-formal">
                        <span>Ainda não tenho diagnóstico formal</span>
                    </label>

                    <p class="mensagem-erro" id="erro-historico" aria-live="polite"></p>
                </fieldset>

                <label class="opcao opcao-adiar">
                    <input type="checkbox" id="preencher-depois" name="preencherDepois">
                    <span>Preencher mais tarde</span>
                </label>

                <button type="submit" id="salvar-btn">Salvar e Continuar</button>
                <p class="mensagem-status" id="mensagem-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="/public/views/dados-complementares/script.js"></script>
</body>

</html>
